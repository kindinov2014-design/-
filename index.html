<style>
/* ================= БАЗА ================= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
:root {
  --bg: #09090c; --bg-2: #120609; --panel: #171014; --panel-2: #241116;
  --text: #e0e0e0; --text-muted: #aaa; --text-dim: #888;
  --accent: #e21b2d; --accent-hover: #ff3547; --accent-glow: rgba(226,27,45,0.42);
  --border: rgba(255,255,255,0.05); --border-soft: rgba(255,255,255,0.1);
  --discord: #a31225; --tg: #c0182b; --yt: #FF0000;
  --success: #ff4a5b; --warn: #ff858e;
  --faction-color: #e21b2d;
}
body.theme-light {
  --bg: #16090b; --bg-2: #260b10; --panel: #1c1114; --panel-2: #2a151a;
  --text: #1c1e21; --text-muted: #4b4f56; --text-dim: #65676b;
  --accent: #e21b2d; --accent-hover: #ff3547; --accent-glow: rgba(226,27,45,0.3);
  --border: rgba(0,0,0,0.08); --border-soft: rgba(0,0,0,0.15);
}
body {
  background-color: var(--bg); color: var(--text);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  line-height: 1.6; overflow-x: hidden; position: relative;
  background: radial-gradient(circle at 50% 0%, var(--bg-2) 0%, var(--bg) 60%);
  transition: background 0.6s ease, color 0.4s ease;
}
#bg-glow {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -2; pointer-events: none;
  background: radial-gradient(circle 800px at var(--mouse-x,50%) var(--mouse-y,50%), var(--accent-glow), transparent 80%);
  opacity: 0.4; transition: background 0.1s ease;
}
body.theme-light #bg-glow { opacity: 0.15; }

/* ================= TOPBAR ================= */
.topbar {
  background-color: rgba(10,10,15,0.85); padding: 10px 30px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
body.theme-light .topbar { background-color: rgba(255,255,255,0.85); }
.logo { font-size: 1.5rem; font-weight: 900; color: var(--text); letter-spacing: 1px;
  display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; user-select: none; }
.logo span { color: var(--accent); font-size: 1.7rem; }
.topbar-nav { display: flex; gap: 5px; background: var(--border); padding: 6px 10px; border-radius: 30px; border: 1px solid var(--border); flex-wrap: wrap; }
.nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.2s; }
.nav-btn:hover { color: var(--text); background: var(--border-soft); }
.nav-btn.active { background: var(--accent); color: #fff; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.icon-btn { background: var(--border); border: 1px solid var(--border-soft); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1rem; position: relative; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
.icon-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
.cart-btn { background: var(--accent); color: #fff; border: none; }
.cart-btn:hover { background: var(--accent-hover); }
.cart-count { position: absolute; top: -3px; right: -3px; background: #fff; color: var(--accent); font-size: 0.7rem; font-weight: 900; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.user-btn { display: flex; align-items: center; gap: 8px; background: linear-gradient(145deg, #8b0000, var(--accent)); color: #fff; padding: 8px 16px; border-radius: 30px; border: none; cursor: pointer; font-weight: 700; font-size: 0.85rem; font-family: inherit; transition: all 0.2s; }
.user-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px var(--accent-glow); }
.user-btn .avatar { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; overflow: hidden; }
.user-btn .avatar img { width: 100%; height: 100%; object-fit: cover; }
.lang-btn { background: var(--border); border: 1px solid var(--border-soft); color: var(--text); padding: 8px 12px; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 0.8rem; font-family: inherit; min-width: 60px; transition: all 0.2s; }
.lang-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ================= PAGES ================= */
.page { display: none; animation: pageFade 0.3s ease; }
.page.active { display: block; }
@keyframes pageFade { from { opacity: 0; } to { opacity: 1; } }

/* ================= HERO ================= */
.hero { position: relative; height: min(82vh,900px); min-height: 620px;
  background: radial-gradient(ellipse at 50% 45%, rgba(28,100,45,.20) 0%, rgba(4,20,9,.18) 55%, rgba(4,20,9,.62) 100%);
  overflow: hidden; display: flex; align-items: center; padding: 70px clamp(24px,8vw,120px); }
.hero::before { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgba(5,7,12,.88) 0%, rgba(5,7,12,.62) 32%, rgba(5,7,12,.08) 72%, rgba(5,7,12,.18) 100%); }
.hero-content { position: relative; z-index: 2; max-width: 700px; text-align: left; padding: clamp(20px,3vw,38px);
  border: 1px solid rgba(100,210,120,.22); border-radius: 24px;
  background: linear-gradient(135deg, rgba(5,12,22,.72), rgba(5,12,22,.25));
  box-shadow: 0 20px 70px rgba(0,0,0,.2); backdrop-filter: blur(3px); }
.hero-content h1 { max-width: 100%; }
.hero h1 { font-size: 4.5rem; font-weight: 900; color: var(--text); letter-spacing: 4px; margin-bottom: 20px; line-height: 1; text-shadow: 0 0 20px var(--accent-glow); }
.hero p { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.7; max-width: 600px; }
.hero-buttons { display: flex; gap: 15px; flex-wrap: wrap; }

.btn-primary, .btn-secondary, .btn-discord { padding: 16px 40px; border: none; border-radius: 30px; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block; font-family: inherit; text-align: center; transition: all 0.25s ease; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-3px); box-shadow: 0 5px 15px var(--accent-glow); }
.btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border-soft); }
.btn-secondary:hover { border-color: var(--accent); background: var(--panel-2); transform: translateY(-3px); }
.btn-discord { background: var(--discord); color: #fff; }
.btn-discord:hover { background: #246b3b; transform: translateY(-3px); }

/* ================= TIMER ================= */
.timer-section { max-width: 900px; margin: 40px auto; padding: 0 60px; }
.timer-box { background: var(--panel); border: 2px solid var(--accent); border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.timer-label { color: var(--accent); font-size: 0.85rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
.timer-title { font-size: 1.6rem; color: var(--text); font-weight: 900; margin-bottom: 20px; }
.timer-title span { color: var(--accent); }
.timer-grid { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timer-cell { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 12px; padding: 15px 20px; min-width: 80px; }
.timer-num { font-size: 2.2rem; font-weight: 900; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.timer-cell-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; font-weight: 700; }

/* ================= GAME (REVERSE) ================= */
.game-section { max-width: 900px; margin: 40px auto; padding: 0 60px; }
.game-box { background: var(--panel); border: 2px solid var(--accent); border-radius: 20px; padding: 30px; text-align: center; }
.game-title { font-size: 1.5rem; color: var(--accent); font-weight: 900; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
.game-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
.game-mode-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.game-mode-tab { background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: 700; font-size: 0.8rem; font-family: inherit; transition: all 0.2s; }
.game-mode-tab:hover { color: var(--text); border-color: var(--accent); }
.game-mode-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.game-area { position: relative; width: 100%; height: 300px; background: var(--bg); border: 1px solid var(--border-soft); border-radius: 16px; overflow: hidden; margin-bottom: 20px; cursor: crosshair; user-select: none; }
.game-target { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; border: 2px solid #fff; animation: targetIn 0.25s ease; }
.game-target.fast { background: #ffd700; width: 30px; height: 30px; font-size: 1rem; }
.game-target.boss { background: #8b0000; width: 60px; height: 60px; font-size: 2rem; border: 3px solid #ffd700; }
@keyframes targetIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.boss-target { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle, #ff0000, #8b0000); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #fff; border: 3px solid #ffd700; box-shadow: 0 0 25px rgba(255,0,0,0.7); animation: bossPulse 1s ease-in-out infinite; }
@keyframes bossPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.splatter { position: absolute; width: 10px; height: 10px; background: #ff3333; border-radius: 50%; pointer-events: none; z-index: 10; animation: splatter-anim 0.5s ease-out forwards; }
@keyframes splatter-anim { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
.game-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 15px; flex-wrap: wrap; }
.game-stat { text-align: center; }
.game-stat-val { font-size: 1.8rem; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
.game-stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.game-combo { font-size: 1.2rem; color: #ffd700; font-weight: 900; height: 30px; opacity: 0; transition: opacity 0.2s; }
.game-combo.active { opacity: 1; }
.game-start-btn { background: var(--accent); color: #fff; padding: 14px 40px; border: none; border-radius: 30px; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.game-start-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
.game-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; padding: 20px; }
.game-overlay h3 { font-size: 2rem; margin-bottom: 10px; color: var(--accent); }
.game-overlay p { font-size: 1rem; margin-bottom: 20px; }
.leaderboard-btn { background: linear-gradient(120deg, #ffd700, #ff8c00); color: #000; padding: 12px 28px; border: none; border-radius: 30px; font-weight: 900; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; margin-top: 15px; transition: all 0.2s; }
.leaderboard-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,200,0,0.5); }

/* ================= GAME REPORT (пункт 3) ================= */
.game-report { display: none; margin-top: 18px; padding: 18px 22px; background: linear-gradient(135deg, rgba(226,27,45,.14), rgba(0,0,0,.25)); border: 1px solid var(--accent); border-radius: 14px; text-align: left; animation: reportIn 0.5s cubic-bezier(0.22,1,0.36,1); }
.game-report.show { display: block; }
@keyframes reportIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.game-report-title { color: var(--accent); font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 8px; }
.game-report-text { color: var(--text-muted); font-size: 0.9rem; line-height: 1.7; }
.game-report-text strong { color: var(--accent); }
.game-report-rank { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 900; font-size: 0.75rem; letter-spacing: 1px; }

/* ================= DUEL ================= */
.duel-section { max-width: 900px; margin: 40px auto; padding: 0 60px; }
.duel-box { padding: 30px; text-align: center; }
.duel-title { font-size: 1.4rem; font-weight: 900; color: var(--text); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
.duel-title span { color: var(--accent); }
.duel-sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
.duel-difficulty { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.duel-diff-btn { background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.8rem; font-family: inherit; transition: all 0.2s; }
.duel-diff-btn:hover { color: var(--text); border-color: var(--accent); }
.duel-diff-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.duel-arena { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.duel-side { background: rgba(0,0,0,0.25); border: 1px solid var(--border-soft); border-radius: 16px; padding: 20px; }
.duel-side.player { border-color: var(--accent); }
.duel-side.bot { border-color: #c0182b; }
.duel-side-name { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.duel-side.player .duel-side-name { color: var(--accent); }
.duel-side.bot .duel-side-name { color: #c0182b; }
.duel-side-score { font-size: 2.5rem; font-weight: 900; color: var(--text); }
.duel-side-bar { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.duel-side-bar-fill { height: 100%; border-radius: 4px; transition: width 0.1s; }
.duel-side.player .duel-side-bar-fill { background: linear-gradient(90deg, #ff3333, #ff8c00); }
.duel-side.bot .duel-side-bar-fill { background: linear-gradient(90deg, #c0182b, #00e5ff); }
.duel-timer { font-size: 1.2rem; font-weight: 900; color: var(--accent); margin-bottom: 15px; }
.duel-click-btn { background: linear-gradient(120deg, var(--accent), #b388ff); color: #fff; padding: 30px 60px; border: none; border-radius: 20px; font-weight: 900; font-size: 1.3rem; text-transform: uppercase; cursor: pointer; font-family: inherit; letter-spacing: 2px; width: 100%; user-select: none; transition: transform 0.08s; }
.duel-click-btn:active { transform: scale(0.95); }
.duel-click-btn:disabled { background: var(--border-soft); color: var(--text-dim); cursor: not-allowed; }
.duel-result { font-size: 1.2rem; font-weight: 900; margin-top: 15px; min-height: 30px; }
.duel-result.win { color: var(--success); }
.duel-result.lose { color: var(--accent); }
.duel-result.draw { color: var(--warn); }

/* ================= FRIENDS ================= */
.friends-section { max-width: 900px; margin: 40px auto; padding: 0 60px; }
.friends-box { padding: 30px; }
.friends-title { font-size: 1.4rem; font-weight: 900; color: var(--text); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; text-align: center; }
.friends-title span { color: var(--accent); }
.friends-sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
.friends-add-row { display: flex; gap: 8px; margin-bottom: 20px; }
.friends-input { flex: 1; background: rgba(0,0,0,0.25); border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 0.95rem; font-family: inherit; }
.friends-input:focus { outline: none; border-color: var(--accent); }
.friends-add-btn { background: var(--accent); color: #fff; padding: 12px 24px; border: none; border-radius: 12px; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: background 0.2s; }
.friends-add-btn:hover { background: var(--accent-hover); }
.friends-list { display: flex; flex-direction: column; gap: 10px; }
.friend-card { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px 16px; }
.friend-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(145deg, var(--accent), #8b0000); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; overflow: hidden; }
.friend-avatar img { width: 100%; height: 100%; object-fit: cover; }
.friend-info { flex: 1; min-width: 0; }
.friend-name { color: var(--text); font-weight: 800; font-size: 0.95rem; }
.friend-status { color: var(--text-dim); font-size: 0.75rem; margin-top: 2px; }
.friend-record { color: #ffd700; font-weight: 900; font-size: 0.85rem; white-space: nowrap; }
.friend-remove { background: transparent; border: 1px solid var(--border-soft); color: var(--text-dim); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: inherit; transition: all 0.2s; }
.friend-remove:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.friends-empty { text-align: center; color: var(--text-dim); padding: 30px 0; font-style: italic; }

/* ================= PROMO / PREDICTION ================= */
.promo { max-width: 1200px; margin: 40px auto; padding: 0 60px; display: flex; gap: 15px; }
.promo-input { flex: 1; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 15px; padding: 20px 30px; color: var(--text); font-size: 0.95rem; text-align: center; font-family: inherit; transition: all 0.2s; }
.promo-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
.promo-btn { background: var(--accent); color: #fff; padding: 20px 40px; border: none; border-radius: 15px; font-weight: 800; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.2s; }
.promo-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
.prediction-section { max-width: 1200px; margin: 40px auto; padding: 0 60px; text-align: center; }
.prediction-box { background: var(--panel); border: 2px solid var(--border-soft); border-radius: 20px; padding: 40px; }
.prediction-title { font-size: 1.5rem; color: var(--accent); font-weight: 900; margin-bottom: 15px; letter-spacing: 2px; text-transform: uppercase; }
.prediction-text { font-size: 1.2rem; color: var(--text); margin-bottom: 25px; min-height: 60px; display: flex; align-items: center; justify-content: center; font-style: italic; transition: opacity 0.3s ease; }
.prediction-btn { background: var(--accent); color: #fff; padding: 16px 45px; border: none; border-radius: 30px; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.prediction-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

/* ================= TIMELINE ================= */
.timeline-section { max-width: 900px; margin: 60px auto; padding: 0 60px; }
.timeline-title { font-size: 2rem; font-weight: 900; color: var(--text); margin-bottom: 25px; }
.timeline-title span { color: var(--accent); }
.timeline-wrap { position: relative; padding-left: 40px; }
.timeline-wrap::before { content: ''; position: absolute; left: 15px; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--accent), #b388ff, #00e5ff); border-radius: 2px; }
.timeline-item { position: relative; margin-bottom: 30px; }
.timeline-dot { position: absolute; left: -32px; top: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); border: 3px solid var(--accent); box-shadow: 0 0 15px var(--accent-glow); z-index: 2; }
.timeline-card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 14px; padding: 18px 22px; transition: transform 0.2s, border-color 0.2s; cursor: pointer; }
.timeline-card:hover { transform: translateX(5px); border-color: var(--accent); }
.timeline-date { font-size: 0.75rem; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
.timeline-event-title { font-size: 1.05rem; color: var(--text); font-weight: 800; margin-bottom: 6px; }
.timeline-event-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }
.timeline-emoji { font-size: 1.5rem; margin-right: 8px; }
.timeline-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.timeline-filter { background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.8rem; font-family: inherit; transition: all 0.2s; }
.timeline-filter.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ================= MAP ================= */
.map-section { max-width: 1200px; margin: 60px auto; padding: 0 60px; }
.map-title { font-size: 2rem; font-weight: 900; color: var(--text); margin-bottom: 25px; }
.map-title span { color: var(--accent); }
.map-container { background: var(--panel); border: 2px solid var(--border-soft); border-radius: 24px; padding: 30px; }
.map-svg { width: 100%; height: auto; display: block; border-radius: 16px; min-height: 600px; }
.map-line { stroke-dasharray: 8 6; animation: dash 3s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -28; } }
.map-point { cursor: pointer; }
.map-point:hover circle:first-child { r: 22; fill: var(--accent); filter: drop-shadow(0 0 10px var(--accent)); }
.map-point circle { transition: all 0.3s ease; }
.map-point text { transition: all 0.3s ease; pointer-events: none; }
.map-point.danger-zone circle:first-child { animation: dangerPulse 1.6s ease-in-out infinite; }
@keyframes dangerPulse { 0%,100% { opacity: 0.9; } 50% { opacity: 0.45; } }
.map-info { background: var(--bg); border: 1px solid var(--accent); border-radius: 16px; padding: 25px 30px; margin-top: 20px; text-align: center; color: var(--text); min-height: 80px; }
.map-info strong { color: var(--accent); font-size: 1.3rem; display: block; margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
.map-info .map-meta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.map-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.map-badge.low { background: rgba(76,175,80,.15); color: #4caf50; border: 1px solid rgba(76,175,80,.4); }
.map-badge.mid { background: rgba(255,200,0,.15); color: #ffc800; border: 1px solid rgba(255,200,0,.4); }
.map-badge.high { background: rgba(226,27,45,.15); color: var(--accent); border: 1px solid rgba(226,27,45,.4); }
.map-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
.map-filter { background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.8rem; font-family: inherit; transition: all 0.2s; }
.map-filter.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ================= SHOWCASE ================= */
.section-wrapper { padding: 0 60px; margin-bottom: 40px; }
.section-title { font-size: 2rem; font-weight: 900; color: var(--text); margin-bottom: 25px; }
.section-title span { color: var(--accent); }
.showcase-tabs { display: flex; gap: 10px; margin-bottom: 30px; padding: 0 60px; flex-wrap: wrap; }
.showcase-tab { background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 12px 28px; border-radius: 25px; cursor: pointer; font-weight: 700; font-size: 0.85rem; font-family: inherit; transition: all 0.2s; }
.showcase-tab:hover { color: var(--text); border-color: var(--accent); }
.showcase-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.showcase-content { display: none; }
.showcase-content.active { display: block; }
.showcase-description { background: var(--panel); border-left: 4px solid var(--accent); border-radius: 0 16px 16px 0; padding: 25px 30px; margin-bottom: 25px; color: var(--text-muted); font-size: 0.95rem; line-height: 1.8; }
.showcase-description strong { color: var(--accent); font-size: 1.1rem; }
.carousel { display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; padding-bottom: 20px; }
.carousel::-webkit-scrollbar { height: 6px; }
.carousel::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
.card { flex: 0 0 300px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 16px; overflow: hidden; cursor: pointer; position: relative; transition: transform 0.25s, border-color 0.25s; }
.card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
.card-image { width: 100%; height: 180px; background: linear-gradient(135deg, var(--bg-2), var(--bg)); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; position: relative; }
.card-image::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.8) 100%); }
.card-content { padding: 18px; }
.card-title { font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 5px; }
.card-subtitle { font-size: 0.8rem; color: var(--accent); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.card-add { position: absolute; top: 10px; right: 10px; background: var(--panel); border: 1px solid var(--accent); color: var(--accent); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; z-index: 5; transition: all 0.2s; }
.card-add:hover { background: var(--accent); color: #fff; }
.card-add.added { background: var(--accent); color: #fff; }

/* ================= SHOP ================= */
.big-banner { max-width: 1200px; margin: 60px auto; padding: 0 60px; }
.big-banner-inner { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 20px; padding: 60px; text-align: center; }
.big-banner h2 { font-size: 2.2rem; color: var(--text); margin-bottom: 15px; }
.big-banner p { color: var(--text-muted); font-size: 1rem; margin-bottom: 25px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; padding: 0 60px; }
.shop-item { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; position: relative; transition: transform 0.25s, border-color 0.25s; }
.shop-item:hover { transform: translateY(-5px); border-color: var(--accent); }
.shop-emoji { font-size: 4rem; margin-bottom: 15px; }
.shop-name { font-size: 1.2rem; color: var(--text); font-weight: 800; margin-bottom: 10px; }
.shop-price { font-size: 1.5rem; color: var(--accent); font-weight: 900; margin-bottom: 15px; min-height: 2rem; }
.shop-price.free { color: var(--success); font-size: 1.1rem; }
.shop-price.no-price { color: var(--text-dim); font-size: 0.75rem; font-weight: 600; font-style: italic; line-height: 1.5; min-height: 3rem; padding: 0 10px; }
.shop-discount { position: absolute; top: 10px; right: 10px; background: var(--accent); color: #fff; font-size: 0.8rem; font-weight: 900; padding: 5px 12px; border-radius: 20px; z-index: 2; }
.shop-buy { background: var(--accent); color: #fff; padding: 12px 30px; border: none; border-radius: 25px; font-weight: 800; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.shop-buy:hover { background: var(--accent-hover); transform: scale(1.05); }
.deal-banner { background: linear-gradient(120deg, rgba(255,51,51,0.15), rgba(255,140,0,0.1)); border: 2px solid var(--accent); border-radius: 16px; padding: 20px 24px; margin-bottom: 25px; text-align: center; position: relative; overflow: hidden; }
.deal-banner::before { content: '🔥'; position: absolute; top: -10px; right: 10px; font-size: 4rem; opacity: 0.15; transform: rotate(15deg); }
.deal-title { font-size: 1.2rem; color: var(--accent); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
.deal-product { font-size: 1rem; color: var(--text); font-weight: 700; margin-bottom: 6px; }
.deal-price { font-size: 1.5rem; color: #ffd700; font-weight: 900; }
.deal-old-price { font-size: 0.9rem; color: var(--text-dim); text-decoration: line-through; margin-left: 8px; }
.deal-timer { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }
.checkout-summary { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.checkout-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 0.9rem; color: var(--text-muted); }
.checkout-row.total { border-top: 1px dashed var(--border-soft); padding-top: 10px; margin-top: 6px; font-size: 1rem; color: var(--text); font-weight: 800; }
.checkout-row.total .checkout-coins { color: #ffd700; font-size: 1.15rem; }
.checkout-success { text-align: center; padding: 30px 20px; }
.checkout-success-icon { font-size: 5rem; margin-bottom: 15px; animation: redisoneyBounce 1s ease-in-out infinite; }
.checkout-success-title { font-size: 1.4rem; color: var(--success); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
.checkout-success-text { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }
.fav-btn { position: absolute; top: 10px; left: 10px; background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-dim); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; z-index: 6; transition: all 0.2s; }
.fav-btn:hover { border-color: #e24a90; color: #e24a90; transform: scale(1.1); }
.fav-btn.active { background: #e24a90; color: #fff; border-color: #e24a90; }
.fav-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }

/* ================= MUSIC ================= */
.music-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; padding: 0 60px; }
.music-item { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 16px; padding: 25px; cursor: pointer; transition: transform 0.25s, border-color 0.25s; }
.music-item:hover { transform: translateY(-5px); border-color: var(--accent); }
.music-cover { font-size: 3rem; margin-bottom: 15px; }
.music-name { font-size: 1.1rem; color: var(--text); font-weight: 800; margin-bottom: 5px; }
.music-artist { font-size: 0.85rem; color: var(--accent); font-weight: 700; }

/* ================= RADIO EPSILON (пункт 10) ================= */
.radio-box { max-width: 1200px; margin: 0 auto 30px; padding: 0 60px; }
.radio-inner { background: linear-gradient(135deg, rgba(226,27,45,.08), rgba(0,0,0,.3)); border: 1px solid var(--accent); border-radius: 18px; padding: 24px 28px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.radio-freq { font-size: 1.6rem; font-weight: 900; color: var(--accent); letter-spacing: 2px; font-variant-numeric: tabular-nums; }
.radio-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
.radio-visualizer { display: flex; gap: 4px; align-items: flex-end; height: 40px; flex: 1; min-width: 120px; }
.radio-bar { flex: 1; background: var(--accent); border-radius: 2px; height: 20%; opacity: 0.35; transition: height 0.12s ease, opacity 0.12s ease; }
.radio-inner.playing .radio-bar { opacity: 1; }
.radio-status { font-size: 0.8rem; color: var(--text-muted); }
.radio-inner.playing .radio-status { color: var(--accent); }
.radio-btn { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 52px; height: 52px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
.radio-btn:hover { background: var(--accent-hover); transform: scale(1.06); }

/* ================= COOP ================= */
.coop-section { max-width: 800px; margin: 0 auto; padding: 0 60px; }
.coop-form { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 20px; padding: 40px; }
.coop-form h3 { color: var(--text); font-size: 1.5rem; margin-bottom: 25px; }
.coop-form input, .coop-form textarea { width: 100%; background: var(--bg); border: 1px solid var(--border-soft); border-radius: 10px; padding: 14px 18px; color: var(--text); font-size: 1rem; font-family: inherit; margin-bottom: 15px; }
.coop-form input:focus, .coop-form textarea:focus { outline: none; border-color: var(--accent); }
.coop-form textarea { min-height: 120px; resize: vertical; }
.coop-discord { text-align: center; color: var(--text-dim); margin-top: 20px; font-size: 0.9rem; }
.coop-discord a { color: var(--discord); font-weight: 700; text-decoration: none; }
.coop-discord a:hover { text-decoration: underline; }

/* ================= ABOUT ================= */
.about-section { max-width: 1200px; margin: 60px auto; padding: 0 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
.about-image { background: var(--panel); border-radius: 20px; height: 400px; display: flex; align-items: center; justify-content: center; font-size: 6rem; border: 1px solid var(--border-soft); }
.about-text h2 { font-size: 2rem; color: var(--text); margin-bottom: 20px; }
.about-text p { color: var(--text-muted); font-size: 1rem; line-height: 1.8; margin-bottom: 12px; }
.about-socials { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.about-socials a { padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; text-decoration: none; color: var(--text); border: 1px solid var(--border-soft); transition: all 0.2s; }
.about-socials a.tg:hover { background: var(--tg); color: #fff; border-color: var(--tg); }
.about-socials a.yt:hover { background: var(--yt); color: #fff; border-color: var(--yt); }
.about-socials a.ds:hover { background: var(--discord); color: #fff; border-color: var(--discord); }

/* ================= CHARACTERS ================= */
.char-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 60px; }
.char-card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 18px; padding: 25px 20px; text-align: center; cursor: pointer; position: relative; overflow: hidden; transition: transform 0.25s, border-color 0.25s; }
.char-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--char-color, var(--accent)); }
.char-card:hover { transform: translateY(-5px); border-color: var(--char-color, var(--accent)); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
.char-avatar { width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; background: var(--bg); border: 3px solid var(--char-color, var(--accent)); overflow: hidden; }
.char-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.char-name { font-size: 1.15rem; color: var(--text); font-weight: 900; margin-bottom: 4px; }
.char-role { font-size: 0.72rem; color: var(--char-color, var(--accent)); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
.char-desc { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; min-height: 50px; }
.char-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.65rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.char-badge.alive { background: rgba(255,53,71,0.12); color: var(--success); border: 1px solid rgba(255,53,71,0.3); }
.char-badge.dead { background: rgba(255,51,51,0.12); color: var(--accent); border: 1px solid rgba(255,51,51,0.3); }
.char-badge.unknown { background: rgba(255,200,0,0.12); color: var(--warn); border: 1px solid rgba(255,200,0,0.3); }
.char-badge.captive { background: rgba(150,100,255,0.12); color: #b388ff; border: 1px solid rgba(150,100,255,0.3); }

/* ================= LORE ================= */
.lore-accordion-wrapper { max-width: 1200px; margin: 0 auto; padding: 0 60px; }
.lore-item { background: var(--panel); border: 2px solid var(--border-soft); border-radius: 16px; margin-bottom: 15px; overflow: hidden; }
.lore-item.active { border-color: var(--accent); }
.lore-header { display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; cursor: pointer; }
.lore-header:hover { background: var(--bg); }
.lore-header-left { display: flex; align-items: center; gap: 15px; }
.lore-icon { font-size: 1.8rem; }
.lore-header-title { font-size: 1.15rem; color: var(--text); font-weight: 800; }
.lore-header-icon { font-size: 1.3rem; color: var(--accent); transition: transform 0.3s ease; }
.lore-item.active .lore-header-icon { transform: rotate(180deg); }
.lore-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
.lore-item.active .lore-body { max-height: 3000px; }
.lore-body-inner { padding: 0 28px 28px 28px; border-top: 1px dashed var(--border-soft); padding-top: 20px; color: var(--text-muted); font-size: 0.95rem; line-height: 1.8; }
.lore-body-inner strong { color: var(--accent); }
.lore-body-inner ul { margin: 10px 0 10px 20px; }
.lore-body-inner li { margin-bottom: 6px; }

/* ================= SEASONS ================= */
.season-accordion-wrapper { max-width: 1200px; margin: 0 auto; padding: 0 60px; }
.season-accordion-item { background: var(--panel); border: 2px solid var(--border-soft); border-radius: 16px; margin-bottom: 15px; overflow: hidden; }
.season-accordion-item.active { border-color: var(--accent); }
.season-header { display: flex; justify-content: space-between; align-items: center; padding: 25px 30px; cursor: pointer; }
.season-header:hover { background: var(--bg); }
.season-header-left { display: flex; align-items: center; gap: 20px; }
.season-header-number { font-size: 2.5rem; font-weight: 900; color: transparent; -webkit-text-stroke: 2px var(--accent); line-height: 1; }
.season-accordion-item.active .season-header-number { color: var(--accent); -webkit-text-stroke: 0; }
.season-header-title { font-size: 1.3rem; color: var(--text); font-weight: 800; }
.season-header-badge { display: inline-block; padding: 4px 12px; border-radius: 15px; font-size: 0.65rem; font-weight: 800; margin-left: 10px; vertical-align: middle; }
.badge-dev { background: rgba(255,200,0,0.15); color: var(--warn); border: 1px solid rgba(255,200,0,0.4); }
.badge-soon { background: rgba(255,51,51,0.15); color: var(--accent); border: 1px solid rgba(255,51,51,0.4); }
.season-header-icon { font-size: 1.5rem; color: var(--accent); transition: transform 0.3s ease; }
.season-accordion-item.active .season-header-icon { transform: rotate(180deg); }
.season-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
.season-accordion-item.active .season-body { max-height: 2500px; }
.season-body-inner { padding: 0 30px 30px 30px; border-top: 1px dashed var(--border-soft); padding-top: 25px; }
.season-stats { color: var(--accent); font-weight: 700; font-size: 0.95rem; margin-bottom: 20px; text-transform: uppercase; }
.season-episode-item { background: var(--bg); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 15px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.2s, background 0.2s; }
.season-episode-item:hover { background: var(--panel-2); transform: translateX(5px); }
.season-episode-title { color: var(--text); font-weight: 700; font-size: 1rem; }
.season-episode-sub { color: var(--accent); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }

/* ================= MODALS (общие) ================= */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; }
.modal-overlay.active { display: flex; opacity: 1; }
.modal { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 20px; padding: 40px; max-width: 450px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.modal-close { position: absolute; top: 15px; right: 20px; background: transparent; border: none; color: var(--text-dim); font-size: 1.8rem; cursor: pointer; transition: all 0.2s; }
.modal-close:hover { color: var(--accent); transform: rotate(90deg); }
.modal h2 { font-size: 1.6rem; color: var(--text); margin-bottom: 25px; text-align: center; letter-spacing: 2px; text-transform: uppercase; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; color: var(--text-dim); font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
.form-group input, .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border-soft); border-radius: 10px; padding: 14px 18px; color: var(--text); font-size: 1rem; font-family: inherit; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
.form-group select option { background: var(--panel); color: var(--text); }
.modal-btn { width: 100%; background: var(--accent); color: #fff; padding: 16px; border: none; border-radius: 10px; font-weight: 800; font-size: 0.95rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: inherit; margin-top: 10px; transition: background 0.2s; }
.modal-btn:hover { background: var(--accent-hover); }
.modal-switch { text-align: center; margin-top: 20px; color: var(--text-dim); font-size: 0.9rem; }
.modal-switch a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 700; }
.error-msg { color: var(--accent); font-size: 0.85rem; text-align: center; margin-top: 10px; min-height: 20px; }
.promo-modal { background: var(--panel); border: 2px solid #ffd700; border-radius: 20px; padding: 50px 40px; max-width: 500px; width: 100%; text-align: center; }
.promo-emoji { font-size: 5rem; margin-bottom: 20px; }
.promo-title { font-size: 1.8rem; color: #ffd700; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
.promo-reward { font-size: 1.2rem; color: var(--text); margin-bottom: 30px; }
.promo-modal-btn { background: linear-gradient(145deg, #ffd700, #ff8c00); color: #000; padding: 16px 50px; border: none; border-radius: 30px; font-weight: 900; font-size: 1rem; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: transform 0.2s; }
.promo-modal-btn:hover { transform: translateY(-2px); }
.auth-required { background: var(--panel); border: 2px solid var(--accent); border-radius: 20px; padding: 50px 40px; max-width: 500px; width: 100%; text-align: center; position: relative; }
.auth-required-emoji { font-size: 5rem; margin-bottom: 20px; }
.auth-required-title { font-size: 1.6rem; color: var(--accent); font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
.auth-required-text { color: var(--text-muted); font-size: 1rem; margin-bottom: 30px; }
.auth-required-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
.auth-required-btn { padding: 14px 35px; border: none; border-radius: 30px; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.auth-required-btn.primary { background: var(--accent); color: #fff; }
.auth-required-btn.primary:hover { background: var(--accent-hover); }
.auth-required-btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border-soft); }
.auth-required-btn.secondary:hover { border-color: var(--accent); }
.auth-required-close { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(226,27,45,.5); border-radius: 50%; background: #210d12; color: #fff; font-size: 1.65rem; line-height: 1; cursor: pointer; z-index: 5; transition: all 0.2s; }
.auth-required-close:hover { background: #a91428; transform: rotate(90deg); }

/* ================= CHARACTER MODAL ================= */
.char-modal { background: var(--panel); border: 2px solid var(--char-color, var(--accent)); border-radius: 20px; padding: 40px; max-width: 600px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; }
.char-modal-header { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
.char-modal-avatar { width: 100px; height: 100px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: var(--bg); border: 3px solid var(--char-color, var(--accent)); overflow: hidden; }
.char-modal-title h2 { font-size: 1.6rem; color: var(--text); margin-bottom: 5px; text-align: left; }
.char-modal-role { font-size: 0.8rem; color: var(--char-color, var(--accent)); font-weight: 800; text-transform: uppercase; }
.char-modal-section { margin-bottom: 18px; }
.char-modal-section h4 { color: var(--char-color, var(--accent)); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 6px; font-weight: 800; }
.char-modal-section p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.7; }
.char-modal-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
.char-tag { background: var(--bg); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; }

/* ================= CINEMA ================= */
.cinema-modal { background: #000; border: 2px solid var(--accent); border-radius: 20px; padding: 20px; max-width: 1000px; width: 100%; position: relative; box-shadow: 0 0 50px rgba(255,51,51,0.2); }
.cinema-modal .modal-close { color: #fff; z-index: 10; text-shadow: 0 0 5px #000; }

/* ================= LEADERBOARD ================= */
.leaderboard-modal { background: linear-gradient(160deg, #1a0f00, #0f0f15 70%, #1a0505); border: 2px solid #ffd700; border-radius: 20px; padding: 35px 25px; max-width: 520px; width: 100%; position: relative; box-shadow: 0 0 50px rgba(255,200,0,0.3); max-height: 85vh; overflow-y: auto; }
.leaderboard-title { font-size: 1.6rem; font-weight: 900; text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: waterFlow 3s linear infinite; }
.leaderboard-mode-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 15px; }
.leaderboard-mode-tab { background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.75rem; font-family: inherit; }
.leaderboard-mode-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.leaderboard-list { display: flex; flex-direction: column; gap: 8px; }
.leaderboard-row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 16px; }
.leaderboard-row.top-1 { background: linear-gradient(120deg, rgba(255,215,0,0.25), rgba(255,140,0,0.15)); border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
.leaderboard-row.top-2 { background: linear-gradient(120deg, rgba(192,192,192,0.2), rgba(160,160,160,0.1)); border-color: #c0c0c0; }
.leaderboard-row.top-3 { background: linear-gradient(120deg, rgba(205,127,50,0.2), rgba(139,69,19,0.1)); border-color: #cd7f32; }
.leaderboard-rank { font-size: 1.3rem; font-weight: 900; min-width: 38px; text-align: center; color: var(--accent); }
.leaderboard-row.top-1 .leaderboard-rank { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
.leaderboard-row.top-2 .leaderboard-rank { color: #c0c0c0; }
.leaderboard-row.top-3 .leaderboard-rank { color: #cd7f32; }
.leaderboard-name { flex: 1; color: var(--text); font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leaderboard-score { font-weight: 900; font-size: 1.05rem; color: #ffd700; }
.leaderboard-empty { text-align: center; color: var(--text-dim); padding: 30px 0; font-style: italic; }
.leaderboard-clear-btn { width: 100%; margin-top: 20px; background: transparent; border: 1px solid var(--border-soft); color: var(--text-dim); padding: 12px; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; }
.leaderboard-clear-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ================= NOTIFICATION ================= */
.notification { position: fixed; top: 80px; right: 30px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 18px 25px; color: var(--text); font-weight: 700; font-size: 0.95rem; z-index: 2000; transform: translateX(400px); transition: transform 0.3s ease; max-width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
.notification.show { transform: translateX(0); }
.notification.success { border-color: var(--success); }
.notification.discord { border-color: var(--discord); }

/* ================= ACHIEVEMENT TOAST ================= */
.achievement-toast { position: fixed; top: 80px; right: -400px; background: linear-gradient(120deg, #1a0f00, #2a1a00); border: 2px solid #ffd700; border-radius: 16px; padding: 18px 22px; display: flex; align-items: center; gap: 14px; z-index: 3000; max-width: 360px; box-shadow: 0 0 40px rgba(255,215,0,0.5); transition: right 0.4s cubic-bezier(.34,1.56,.64,1); }
.achievement-toast.show { right: 20px; }
.achievement-toast-icon { font-size: 2.5rem; flex-shrink: 0; animation: redisoneyBounce 1.2s ease-in-out infinite; }
.achievement-toast-title { font-size: 0.75rem; color: #ffd700; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
.achievement-toast-name { font-size: 1rem; color: #fff; font-weight: 900; margin-top: 2px; }
.achievement-toast-xp { font-size: 0.75rem; color: var(--success); margin-top: 2px; font-weight: 700; }
@keyframes redisoneyBounce { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-12px) rotate(5deg); } }
@keyframes redisoneyPulse { from { box-shadow: 0 0 40px rgba(255,51,51,0.4); } to { box-shadow: 0 0 80px rgba(255,51,51,0.7); } }

/* ================= PROFILE (плавное открытие) ================= */
#profileModal.modal-overlay { backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1), visibility 0s linear 0.5s, backdrop-filter 0.5s cubic-bezier(0.22,1,0.36,1), -webkit-backdrop-filter 0.5s cubic-bezier(0.22,1,0.36,1); opacity: 0; visibility: hidden; pointer-events: none; }
#profileModal.modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1), visibility 0s linear 0s, backdrop-filter 0.5s cubic-bezier(0.22,1,0.36,1), -webkit-backdrop-filter 0.5s cubic-bezier(0.22,1,0.36,1); }
.profile-modal { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 18px; padding: 22px 20px; max-width: 390px; width: min(92vw, 390px); max-height: 76vh; overflow-y: auto; overscroll-behavior: contain; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.4); opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(6px); transition: opacity 0.55s cubic-bezier(0.22,1,0.36,1), transform 0.55s cubic-bezier(0.22,1,0.36,1), filter 0.55s cubic-bezier(0.22,1,0.36,1), box-shadow 0.55s ease; will-change: opacity, transform, filter; }
#profileModal.active .profile-modal { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 40px var(--accent-glow); transition: opacity 0.55s cubic-bezier(0.22,1,0.36,1) 0.05s, transform 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.05s, filter 0.5s cubic-bezier(0.22,1,0.36,1) 0.05s, box-shadow 0.7s ease 0.1s; }
.profile-modal > * { opacity: 0; transform: translateY(10px); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22,1,0.36,1); }
#profileModal.active .profile-modal > * { opacity: 1; transform: translateY(0); }
#profileModal.active .profile-modal > *:nth-child(1) { transition-delay: 0.12s; }
#profileModal.active .profile-modal > *:nth-child(2) { transition-delay: 0.16s; }
#profileModal.active .profile-modal > *:nth-child(3) { transition-delay: 0.20s; }
#profileModal.active .profile-modal > *:nth-child(4) { transition-delay: 0.24s; }
#profileModal.active .profile-modal > *:nth-child(5) { transition-delay: 0.28s; }
#profileModal.active .profile-modal > *:nth-child(6) { transition-delay: 0.32s; }
#profileModal.active .profile-modal > *:nth-child(7) { transition-delay: 0.36s; }
#profileModal.active .profile-modal > *:nth-child(n+8) { transition-delay: 0.40s; }
.profile-modal .modal-close { position: sticky; top: 0; float: right; margin: -8px -6px 4px 8px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 1.4rem; line-height: 1; color: var(--text-dim); cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.profile-modal .modal-close:hover { color: var(--accent); border-color: var(--accent); transform: rotate(90deg); }
.profile-modal h2 { font-size: 1.1rem !important; margin-bottom: 14px !important; }
.profile-modal .profile-avatar-large { width: 70px !important; height: 70px !important; font-size: 2rem !important; }
.profile-modal .profile-section-title { font-size: 0.8rem !important; margin: 12px 0 6px !important; }
.profile-modal .color-option { width: 26px !important; height: 26px !important; }
.profile-modal .frame-option, .profile-modal .status-option { padding: 6px 10px !important; font-size: 0.68rem !important; }
.profile-modal .cursor-options { grid-template-columns: repeat(auto-fit, minmax(75px, 1fr)) !important; gap: 6px !important; }
.profile-modal .cursor-option { padding: 8px 6px !important; }
.profile-modal .cursor-option-icon { font-size: 1.2rem !important; height: 24px !important; }
.profile-modal .cursor-option-label { font-size: 0.6rem !important; }
.profile-modal .achievements-grid { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)) !important; gap: 8px !important; }
.profile-modal .achievement-card { padding: 10px 6px !important; }
.profile-modal .achievement-icon { font-size: 1.5rem !important; margin-bottom: 4px !important; }
.profile-modal .achievement-name { font-size: 0.68rem !important; }
.profile-modal .achievement-desc { font-size: 0.55rem !important; }
.profile-modal .modal-btn { padding: 12px !important; font-size: 0.85rem !important; margin-top: 16px !important; }

/* Agent dossier (пункт 9) */
.agent-dossier { background: var(--bg); border: 1px dashed var(--accent); border-radius: 12px; padding: 14px; margin: 12px 0; font-family: ui-monospace, monospace; font-size: 0.8rem; color: var(--text-muted); }
.agent-dossier-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dotted var(--border-soft); }
.agent-dossier-row:last-child { border-bottom: none; }
.agent-dossier-row span:last-child { color: var(--accent); font-weight: 800; }
.agent-rank-badge { display: inline-block; padding: 4px 10px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 0.7rem; font-weight: 900; letter-spacing: 1px; }
.agent-journal { max-height: 120px; overflow-y: auto; background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 0.75rem; color: var(--text-dim); }
.agent-journal-entry { padding: 4px 0; border-bottom: 1px dotted var(--border-soft); }
.agent-journal-entry:last-child { border-bottom: none; }

/* ================= GALERY LIGHTBOX (пункт 6) ================= */
.gallery-card { overflow: hidden; transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease; will-change: transform; }
.gallery-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,255,145,.16); border-color: rgba(76,255,170,.7); }
.gallery-card .gallery-art { height: 190px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #06120f; }
.gallery-card .gallery-art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease, filter .4s ease; filter: saturate(.88) contrast(1.04); }
.gallery-card:hover .gallery-art img { transform: scale(1.045); filter: saturate(1.08) contrast(1.06); }
.gallery-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding: 0 18px 18px; }
.gallery-tag { background: rgba(226,27,45,.1); border: 1px solid rgba(226,27,45,.35); color: var(--accent); padding: 3px 10px; border-radius: 10px; font-size: 0.65rem; font-weight: 800; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
.gallery-tag:hover { background: var(--accent); color: #fff; }
.gallery-tag.active { background: var(--accent); color: #fff; }
.gallery-filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 24px 20px; }
.lightbox { position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,.94); display: none; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; opacity: 0; transition: opacity 0.35s ease; }
.lightbox.active { display: flex; opacity: 1; }
.lightbox img { max-width: 90vw; max-height: 78vh; border-radius: 12px; box-shadow: 0 0 60px rgba(226,27,45,.4); transform: scale(0.95); transition: transform 0.4s cubic-bezier(0.22,1,0.36,1); }
.lightbox.active img { transform: scale(1); }
.lightbox-caption { margin-top: 16px; color: var(--text); font-size: 0.95rem; text-align: center; max-width: 700px; }
.lightbox-close { position: absolute; top: 20px; right: 24px; background: transparent; border: 1px solid var(--accent); color: #fff; font-size: 1.8rem; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.lightbox-close:hover { background: var(--accent); transform: rotate(90deg); }

/* ================= FACTIONS (пункт 7) ================= */
.faction-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 60px; }
.faction-card { border: 1px solid rgba(116,190,133,.28); border-radius: 18px; background: linear-gradient(145deg, rgba(42,12,18,.96), rgba(13,9,12,.98)); box-shadow: 0 12px 35px rgba(0,0,0,.25); padding: 24px; color: #eee; transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s; position: relative; cursor: pointer; }
.faction-card:hover { transform: translateY(-5px); border-color: var(--faction-color, var(--accent)); box-shadow: 0 12px 30px rgba(226,27,45,.2); }
.faction-card.selected { border-color: var(--faction-color, var(--accent)); box-shadow: 0 0 25px var(--faction-color, var(--accent)), inset 0 0 15px rgba(255,255,255,0.05); }
.faction-card .faction-emoji { font-size: 2.5rem; margin-bottom: 12px; }
.faction-card h3 { margin: 0 0 10px; color: #fff; font-size: 1.2rem; }
.faction-card p { color: #d0b8bc; line-height: 1.6; font-size: 0.85rem; margin-bottom: 14px; }
.faction-card button { border: 1px solid var(--faction-color, var(--accent)); background: rgba(255,255,255,0.05); color: #fff; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; }
.faction-card button:hover { background: var(--faction-color, var(--accent)); color: #000; }
.faction-card.selected button { background: var(--faction-color, var(--accent)); color: #fff; }
.faction-status { text-align: center; margin: 25px auto 40px; color: #ffb6be; font-weight: 700; font-size: 0.9rem; padding: 12px 20px; border: 1px dashed var(--accent); border-radius: 12px; max-width: 700px; }
.faction-epsilon { --faction-color: #39c96b; border-top: 3px solid #39c96b; }
.faction-omega { --faction-color: #a88be7; border-top: 3px solid #a88be7; }
.faction-witness { --faction-color: #69b8cf; border-top: 3px solid #69b8cf; }
.faction-badge { display: inline-block; padding: 4px 12px; border-radius: 10px; font-size: 0.7rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; background: rgba(255,255,255,0.08); border: 1px solid var(--faction-color, var(--accent)); color: var(--faction-color, var(--accent)); margin-left: 8px; vertical-align: middle; }

/* ================= TERMINAL (пункт 2) ================= */
.terminal-panel { max-width: 850px; margin: 0 auto 50px; padding: 0 24px; }
.terminal-inner { background: #10080b; border: 1px solid #8e1b2a; border-radius: 14px; padding: 20px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #ffbfc7; box-shadow: 0 0 30px rgba(226,27,45,.18); }
.terminal-top { border-bottom: 1px solid #61202b; padding-bottom: 10px; color: #f0b6bd; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
.terminal-top .dots { color: #8e1b2a; letter-spacing: 4px; }
.terminal-log { max-height: 320px; overflow-y: auto; padding: 14px 0; font-size: 0.85rem; line-height: 1.7; scrollbar-width: thin; }
.terminal-log::-webkit-scrollbar { width: 6px; }
.terminal-log::-webkit-scrollbar-thumb { background: #8e1b2a; border-radius: 3px; }
.terminal-line { margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
.terminal-line.cmd { color: #fff; }
.terminal-line.cmd::before { content: '> '; color: #ff5966; }
.terminal-line.err { color: #ff7780; }
.terminal-line.ok { color: #7bea91; }
.terminal-input-row { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid #61202b; }
.terminal-input-row input { flex: 1; min-width: 0; background: #170b0e; color: #fff; border: 1px solid #8e1b2a; border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 0.85rem; }
.terminal-input-row input:focus { outline: none; border-color: #ff5966; box-shadow: 0 0 8px rgba(226,27,45,.4); }
.terminal-input-row button { border: 1px solid #b51d30; background: #45101a; color: #fff; padding: 10px 18px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
.terminal-input-row button:hover { background: #8d1426; }
.terminal-hint { color: #a35b64; font-size: 0.75rem; margin-top: 10px; }
.terminal-hint code { color: #ff5966; }

/* ================= ACHIEVEMENTS ================= */
.achievements-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
.achievement-card { background: rgba(0,0,0,0.2); border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 10px; text-align: center; transition: all 0.2s; }
.achievement-card.unlocked { border-color: #ffd700; background: linear-gradient(160deg, rgba(255,215,0,0.15), rgba(255,140,0,0.05)); box-shadow: 0 0 15px rgba(255,215,0,0.2); }
.achievement-card.locked { opacity: 0.45; filter: grayscale(1); }
.achievement-icon { font-size: 2rem; margin-bottom: 6px; }
.achievement-name { font-size: 0.78rem; font-weight: 800; color: var(--text); line-height: 1.3; }
.achievement-desc { font-size: 0.65rem; color: var(--text-dim); margin-top: 4px; }

/* ================= CURSORS ================= */
.cursor-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-top: 10px; }
.cursor-option { background: rgba(0,0,0,0.2); border: 2px solid var(--border-soft); border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
.cursor-option:hover { border-color: var(--accent); }
.cursor-option.selected { border-color: var(--accent); background: rgba(255,51,51,0.1); box-shadow: 0 0 15px var(--accent-glow); }
.cursor-option-icon { font-size: 1.5rem; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; height: 30px; }
.cursor-option-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
.cursor-custom-input { display: flex; gap: 6px; margin-top: 10px; }
.cursor-custom-input input { flex: 1; background: rgba(0,0,0,0.25); border: 1px solid var(--border-soft); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 0.85rem; font-family: inherit; }
.cursor-custom-input button { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 800; font-size: 0.8rem; cursor: pointer; font-family: inherit; text-transform: uppercase; }
body.cursor-crosshair, body.cursor-crosshair * { cursor: crosshair !important; }
body.cursor-reverse, body.cursor-reverse * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="%23ff3333" stroke="white" stroke-width="2"/><text x="16" y="21" font-size="14" text-anchor="middle" fill="white" font-weight="bold">R</text></svg>') 16 16, auto !important; }
