<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151b27"/>
      <stop offset=".24" stop-color="#596575"/>
      <stop offset=".48" stop-color="#e3e9f1"/>
      <stop offset=".63" stop-color="#596575"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="redSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff777e"/>
      <stop offset=".45" stop-color="#c4112c"/>
      <stop offset="1" stop-color="#4d0718"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07090e"/>
      <stop offset=".5" stop-color="#292d38"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#203044" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="1140" y="840" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="end" letter-spacing="2" fill="#69778c">AKI DESIGN ARCHIVE</text>
