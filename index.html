<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Аномалия</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; text-align: center; padding: 20px;
        background: radial-gradient(circle at 50% 50%, #1a0505 0%, #050508 100%);
    }
    .wrap { max-width: 500px; }
    .code {
        font-size: 8rem; font-weight: 900; color: #ff3333;
        text-shadow: 0 0 40px #8b0000, 0 0 80px #8b0000;
        line-height: 1; margin-bottom: 20px;
    }
    h1 { font-size: 1.6rem; color: #fff; margin-bottom: 15px; }
    p { color: #aaa; margin-bottom: 25px; line-height: 1.7; }
    a {
        display: inline-block; background: #ff3333; color: #fff;
        padding: 14px 35px; border-radius: 30px; text-decoration: none;
        font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
        font-size: 0.85rem; transition: all 0.3s ease;
    }
    a:hover { background: #ff5555; transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255,51,51,0.6); }
</style>
</head>
<body>
<div class="wrap">
    <div class="code">404</div>
    <h1>Ты заблудился в аномалии</h1>
    <p>Этой страницы не существует. Возможно, её стёрли «Тени», или она никогда не существовала. Вернись на базу, агент.</p>
    <a href="/">← На главную</a>
</div>
</body>
</html>
