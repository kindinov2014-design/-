body.cursor-redstone, body.cursor-redstone * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><rect x="6" y="6" width="20" height="20" rx="2" fill="%23cc0000" stroke="white" stroke-width="2"/><rect x="12" y="12" width="8" height="8" fill="%23ff5555"/></svg>') 16 16, auto !important; }
body.cursor-star, body.cursor-star * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text x="16" y="24" font-size="24" text-anchor="middle">⭐</text></svg>') 16 16, auto !important; }
body.cursor-skull, body.cursor-skull * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text x="16" y="24" font-size="24" text-anchor="middle">💀</text></svg>') 16 16, auto !important; }
body.cursor-nuke, body.cursor-nuke * { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text x="16" y="24" font-size="24" text-anchor="middle">☢️</text></svg>') 16 16, auto !important; }

/* ================= QUOTES ================= */
.quotes-section { max-width: 1000px; margin: 60px auto; padding: 0 60px; }
.quotes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
.quote-card { background: var(--panel); border: 1px solid var(--border-soft); border-left: 4px solid var(--accent); border-radius: 12px; padding: 20px 22px; position: relative; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
.quote-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.quote-text { font-size: 0.95rem; color: var(--text); font-style: italic; line-height: 1.6; margin-bottom: 10px; }
.quote-author { font-size: 0.8rem; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
.quote-copy { position: absolute; top: 10px; right: 10px; background: transparent; border: 1px solid var(--border-soft); color: var(--text-dim); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.quote-card:hover .quote-copy { opacity: 1; }
.quote-copy:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ================= FOOTER ================= */
footer { text-align: center; padding: 50px 20px; color: var(--text-dim); border-top: 1px solid var(--border-soft); margin-top: 60px; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }
.footer-socials { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
.footer-social { color: var(--text-dim); text-decoration: none; font-weight: 700; font-size: 0.75rem; padding: 8px 16px; border: 1px solid var(--border-soft); border-radius: 20px; transition: all 0.2s; }
.footer-social:hover { color: var(--text); border-color: var(--accent); }
.footer-easter { display: inline-block; margin-top: 12px; color: var(--text-dim); font-size: 0.9rem; letter-spacing: 4px; cursor: pointer; opacity: 0.6; transition: opacity 0.3s, color 0.3s; user-select: none; }
.footer-easter:hover { opacity: 1; color: #ff3333; text-shadow: 0 0 10px #ff3333; }

/* ================= BOTTOM NAV (mobile) ================= */
.bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border-soft); z-index: 200; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; }
.bottom-nav-item { flex: 1; background: transparent; border: none; color: var(--text-dim); font-family: inherit; font-size: 0.6rem; font-weight: 700; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
.bottom-nav-item .bn-icon { font-size: 1.2rem; }
.bottom-nav-item.active { color: var(--accent); }

/* ================= CART ================= */
.cart-item { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--border-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; }
.cart-item-emoji { font-size: 1.8rem; flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--panel); border-radius: 10px; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { color: var(--text); font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-item-qty { color: var(--text-dim); font-size: 0.75rem; margin-top: 2px; }
.cart-item-remove { background: transparent; border: 1px solid var(--border-soft); color: var(--text-dim); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: inherit; transition: all 0.2s ease; }
.cart-item-remove:hover { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.08); }

/* ================= ACRYLIC ================= */
.acrylic { position: relative; background: rgba(255,255,255,0.06); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15); border-radius: 20px; overflow: hidden; }
body.theme-light .acrylic { background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 8px 32px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.7); }
.acrylic::before { content: ''; position: absolute; inset: -2px; border-radius: inherit; padding: 2px; background: linear-gradient(120deg, rgba(0,229,255,0.55), rgba(179,136,255,0.55), rgba(255,51,51,0.55), rgba(0,229,255,0.55)); background-size: 300% 300%; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: waterFlow 6s linear infinite; pointer-events: none; filter: blur(0.4px); opacity: 0.9; }
.acrylic::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(120% 80% at 10% 0%, rgba(0,229,255,0.12), transparent 60%), radial-gradient(120% 80% at 90% 100%, rgba(179,136,255,0.12), transparent 60%); pointer-events: none; mix-blend-mode: screen; }
@keyframes waterFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

/* ================= SUGGEST / DAILY / WHEEL ================= */
.suggest-section { max-width: 900px; margin: 60px auto; padding: 0 60px; }
.suggest-box { padding: 40px; text-align: center; }
.suggest-title { font-size: 1.6rem; font-weight: 900; color: var(--text); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
.suggest-title span { color: var(--accent); }
.suggest-desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }
.suggest-form { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
.suggest-input, .suggest-textarea { width: 100%; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 14px 18px; color: var(--text); font-size: 1rem; font-family: inherit; }
.suggest-input:focus, .suggest-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
.suggest-textarea { min-height: 120px; resize: vertical; }
.suggest-btn { background: linear-gradient(120deg, var(--accent), #b388ff); color: #fff; padding: 16px 40px; border: none; border-radius: 30px; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.suggest-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }
.daily-section { max-width: 900px; margin: 40px auto; padding: 0 60px; }
.daily-box { padding: 30px; }
.daily-title { font-size: 1.4rem; font-weight: 900; color: var(--text); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; text-align: center; }
.daily-title span { color: var(--accent); }
.daily-sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
.daily-list { display: flex; flex-direction: column; gap: 10px; }
.daily-task { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px 16px; }
.daily-task.done { border-color: var(--success); background: rgba(255,53,71,0.06); }
.daily-task-icon { font-size: 1.5rem; flex-shrink: 0; }
.daily-task-info { flex: 1; min-width: 0; }
.daily-task-name { color: var(--text); font-weight: 700; font-size: 0.9rem; }
.daily-task-progress { color: var(--text-dim); font-size: 0.75rem; margin-top: 2px; }
.daily-task-reward { color: #ffd700; font-weight: 900; font-size: 0.85rem; white-space: nowrap; }
.daily-task.done .daily-task-reward { color: var(--success); }
.daily-progress-bar { width: 100%; height: 6px; background: var(--bg); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.daily-progress-fill { height: 100%; background: linear-gradient(90deg, #ff3333, #ff8c00); border-radius: 3px; transition: width 0.3s; }
.daily-bonus-box { margin-top: 15px; padding: 20px; text-align: center; background: linear-gradient(120deg, rgba(255,215,0,0.15), rgba(255,140,0,0.1)); border: 2px solid #ffd700; border-radius: 16px; }
.daily-bonus-title { font-size: 1.1rem; font-weight: 900; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.daily-bonus-btn { background: linear-gradient(120deg, #ffd700, #ff8c00); color: #000; padding: 14px 35px; border: none; border-radius: 30px; font-weight: 900; font-size: 0.95rem; text-transform: uppercase; cursor: pointer; font-family: inherit; letter-spacing: 1px; transition: all 0.2s; }
.daily-bonus-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,200,0,0.5); }
.daily-bonus-btn:disabled { background: var(--border-soft); color: var(--text-dim); cursor: not-allowed; }
.daily-bonus-timer { color: var(--text-muted); font-size: 0.8rem; margin-top: 10px; }
.wheel-section { max-width: 900px; margin: 40px auto; padding: 0 60px; }
.wheel-box { padding: 30px; text-align: center; }
.wheel-title { font-size: 1.4rem; font-weight: 900; color: var(--text); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
.wheel-title span { color: var(--accent); }
.wheel-sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
.wheel-wrap { position: relative; width: 280px; height: 280px; margin: 0 auto 20px; }
.wheel-pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 2rem; z-index: 5; filter: drop-shadow(0 0 8px var(--accent)); }
.wheel-disc { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#ff3333 0deg 45deg, #ffd700 45deg 90deg, #b388ff 90deg 135deg, #00e5ff 135deg 180deg, #ff3547 180deg 225deg, #ff8c00 225deg 270deg, #e24a90 270deg 315deg, #c0182b 315deg 360deg); border: 6px solid var(--panel); box-shadow: 0 0 30px var(--accent-glow), inset 0 0 30px rgba(0,0,0,0.3); transition: transform 4s cubic-bezier(.17,.67,.12,.99); position: relative; }
.wheel-disc::after { content: '🎁'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 2.5rem; width: 70px; height: 70px; background: var(--panel); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
.wheel-labels { position: absolute; inset: 0; pointer-events: none; }
.wheel-label { position: absolute; font-size: 0.75rem; font-weight: 900; color: #fff; text-shadow: 0 0 4px #000, 0 0 8px #000; white-space: nowrap; }
.wheel-spin-btn { background: linear-gradient(120deg, #ff3333, #b388ff); color: #fff; padding: 14px 40px; border: none; border-radius: 30px; font-weight: 900; font-size: 0.95rem; text-transform: uppercase; cursor: pointer; font-family: inherit; letter-spacing: 1px; transition: all 0.2s; }
.wheel-spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }
.wheel-spin-btn:disabled { background: var(--border-soft); color: var(--text-dim); cursor: not-allowed; }
.wheel-timer { color: var(--text-muted); font-size: 0.8rem; margin-top: 10px; }

/* ================= FEATURE (архив/миссии/фракции/галерея) ================= */
.feature-intro { max-width: 1000px; margin: 0 auto 24px; padding: 0 24px; color: var(--text-muted); text-align: center; letter-spacing: .08em; font-size: 0.9rem; }
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 18px; max-width: 1200px; margin: 0 auto; padding: 0 24px 45px; }
.feature-card { border: 1px solid rgba(226,27,45,.35); border-radius: 18px; background: linear-gradient(145deg, rgba(42,12,18,.96), rgba(13,9,12,.98)); box-shadow: 0 12px 35px rgba(0,0,0,.25); padding: 24px; color: #eee; transition: transform 0.25s, border-color 0.25s; }

.mission-panel { max-width: 850px; margin: 0 auto 50px; padding: 24px; border: 1px solid rgba(226,27,45,.35); border-radius: 18px; background: linear-gradient(145deg, rgba(42,12,18,.96), rgba(13,9,12,.98)); color: #eee; }

.mission-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

/* ================= GALLERY CARD base ================= */

</style><script>

const LS = {

let faction = localStorage.getItem(LS.faction) || null;

function saveAll() {
  localStorage.setItem(LS.user, JSON.stringify(currentUser));
  localStorage.setItem(LS.cart, JSON.stringify(cart));
  localStorage.setItem(LS.coins, String(coins));
  localStorage.setItem(LS.records, JSON.stringify(records));
  localStorage.setItem(LS.mode, gameMode);
  localStorage.setItem(LS.leaderboard, JSON.stringify(leaderboard));
  localStorage.setItem(LS.friends, JSON.stringify(friends));
  localStorage.setItem(LS.favs, JSON.stringify(favorites));

  localStorage.setItem(LS.journal, JSON.stringify(journal));

/* ===================== АХИВМЕНТЫ (реестр) ===================== */
const ACHIEVEMENTS = {
  first_game: { icon: '🎮', name: 'Первый запуск', desc: 'Сыграть в Реверс' },
  score_10: { icon: '🔟', name: '10 очков', desc: 'Набрать 10 очков' },

function unlockAchievement(id) {
  if (achievements[id]) return;
  achievements[id] = true;
  saveAll();
  const a = ACHIEVEMENTS[id];
  if (!a) return;
  coins += 25;
  localStorage.setItem(LS.coins, String(coins));
  const toast = document.getElementById('achievementToast');
  if (toast) {
    toast.querySelector('.achievement-toast-icon').textContent = a.icon;
    toast.querySelector('.achievement-toast-name').textContent = a.name;
    toast.querySelector('.achievement-toast-xp').textContent = '+25 🪙';

    window._achTimer = setTimeout(() => toast.classList.remove('show'), 3500);
  }

/* ===================== ЖУРНАЛ АГЕНТА (пункт 9) ===================== */
function addJournal(text) {
  journal.unshift({ t: Date.now(), text });
  journal = journal.slice(0, 20);
  saveAll();
  renderJournal();
}
function renderJournal() {
  const box = document.getElementById('agentJournal');
  if (!box) return;
  if (!journal.length) { box.innerHTML = '<div style="color:var(--text-dim);font-style:italic;">Журнал пуст. Начни действовать, агент.</div>'; return; }
  box.innerHTML = journal.map(e => {
    const d = new Date(e.t);
    const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    return `<div class="agent-journal-entry"><span style="color:var(--accent);">[${time}]</span> ${e.text}</div>`;
  }).join('');
}
function generateAgentCode() {
  let code = localStorage.getItem('aki_agent_code');
  if (code) return code;
  code = 'EPS-' + Math.random().toString(36).slice(2, 6).toUpperCase() + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();
  localStorage.setItem('aki_agent_code', code);
  return code;
}
function agentRank() {
  const score = records.normal + records.boss * 2;
  if (score >= 100) return 'Архивариус';
  if (score >= 50) return 'Свидетель';
  if (score >= 15) return 'Оперативник';
  return 'Новичок';
}

/* ===================== КУРСОРЫ ===================== */
function applyCursor(name) {
  document.body.classList.remove('cursor-crosshair','cursor-reverse','cursor-chip','cursor-anomaly','cursor-redstone','cursor-star','cursor-skull','cursor-nuke');
  if (name === 'crosshair') document.body.classList.add('cursor-crosshair');
  else if (name === 'reverse') document.body.classList.add('cursor-reverse');
  else if (name === 'chip') document.body.classList.add('cursor-chip');
  else if (name === 'anomaly') document.body.classList.add('cursor-anomaly');
  else if (name === 'redstone') document.body.classList.add('cursor-redstone');
  else if (name === 'star') document.body.classList.add('cursor-star');
  else if (name === 'skull') document.body.classList.add('cursor-skull');
  else if (name === 'nuke') document.body.classList.add('cursor-nuke');
  if (profile.cursor === 'custom' && profile.customCursor) {
    document.body.style.cursor = `url("${profile.customCursor}") 16 16, auto`;
  } else {
    document.body.style.cursor = '';
  }
}
function selectCursor(name) {
  profile.cursor = name;
  if (name !== 'custom') profile.customCursor = '';
  saveAll();
  applyCursor(name);
  document.querySelectorAll('.cursor-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.cursor === name);
  });
  updateProfileUI();
}
function applyCustomCursor() {
  const input = document.getElementById('customCursorInput');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  profile.cursor = 'custom';
  profile.customCursor = val;
  saveAll();
  applyCursor('custom');
  document.querySelectorAll('.cursor-option').forEach(el => el.classList.remove('selected'));
  updateProfileUI();
  showNotification('🖱️ Кастомный курсор применён', 'success');
}

const FACTION_META = {

    terminalPrint(map[loc] || 'Локации: штаб, бездна, криос, лес', map[loc] ? 'ok' : 'err');

let gameTimer = null, gameLeft = 40, gameScore = 0, gameCombo = 0, comboTimeout = null;
function switchGameMode(mode) {
  gameMode = mode;
  localStorage.setItem(LS.mode, mode);
  document.getElementById('modeNormal')?.classList.toggle('active', mode === 'normal');
  document.getElementById('modeBoss')?.classList.toggle('active', mode === 'boss');
}
function spawnTarget() {
  if (!document.getElementById('gameArea')) return;
  const area = document.getElementById('gameArea');
  const overlay = document.getElementById('gameOverlay');
  if (overlay) overlay.style.display = 'none';
  const rnd = Math.random();
  let type = 'normal';
  if (gameMode === 'boss') {
    if (rnd < 0.18) type = 'boss';
    else if (rnd < 0.55) type = 'fast';
  } else {
    if (rnd < 0.3) type = 'fast';
  }
  const el = document.createElement('div');
  el.className = 'game-target' + (type === 'fast' ? ' fast' : '') + (type === 'boss' ? ' boss' : '');
  el.textContent = type === 'boss' ? '👹' : (type === 'fast' ? '⚡' : '👾');
  const maxX = area.clientWidth - (type === 'boss' ? 70 : (type === 'fast' ? 30 : 40));
  const maxY = area.clientHeight - (type === 'boss' ? 70 : (type === 'fast' ? 30 : 40));
  el.style.left = Math.max(0, Math.random() * maxX) + 'px';
  el.style.top = Math.max(0, Math.random() * maxY) + 'px';
  el.onclick = (e) => {
    e.stopPropagation();
    const points = type === 'boss' ? 10 : (type === 'fast' ? 3 : 1);
    gameScore += points;
    gameCombo++;
    updateGameUI();
    showCombo();
    addSplatter(e, el);
    el.remove();
    if (type === 'boss') unlockAchievement('boss_kill');
    spawnTarget();
  };
  area.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, type === 'boss' ? 2400 : 1800);
}
function showCombo() {
  const c = document.getElementById('gameCombo');
  if (!c) return;
  if (gameCombo >= 3) {
    c.textContent = `🔥 КОМБО x${gameCombo}!`;
    c.classList.add('active');
    clearTimeout(comboTimeout);
    comboTimeout = setTimeout(() => c.classList.remove('active'), 1500);
  }
}
function addSplatter(e, el) {
  const area = document.getElementById('gameArea');
  if (!area) return;
  const sp = document.createElement('div');
  sp.className = 'splatter';
  const rect = area.getBoundingClientRect();
  sp.style.left = (e.clientX - rect.left - 5) + 'px';
  sp.style.top = (e.clientY - rect.top - 5) + 'px';
  area.appendChild(sp);
  setTimeout(() => sp.remove(), 500);
}
function updateGameUI() {
  const s = document.getElementById('gameScore'); if (s) s.textContent = gameScore;
  const t = document.getElementById('gameTime'); if (t) t.textContent = gameLeft;
  const r = document.getElementById('gameRecord'); if (r) r.textContent = records[gameMode] || 0;
}
function startGame() {
  if (gameTimer) clearInterval(gameTimer);
  gameLeft = 40; gameScore = 0; gameCombo = 0;
  document.querySelectorAll('#gameArea .game-target, #gameArea .boss-target').forEach(e => e.remove());
  const overlay = document.getElementById('gameOverlay');
  if (overlay) overlay.style.display = 'none';
  const report = document.getElementById('gameReport');
  if (report) report.classList.remove('show');
  unlockAchievement('first_game');
  updateGameUI();
  spawnTarget();
  gameTimer = setInterval(() => {
    gameLeft--;
    updateGameUI();
    if (gameLeft <= 0) endGame();
  }, 1000);
}
function endGame() {
  clearInterval(gameTimer); gameTimer = null;
  document.querySelectorAll('#gameArea .game-target, #gameArea .boss-target').forEach(e => e.remove());
  const prev = records[gameMode] || 0;
  const isRecord = gameScore > prev;
  if (isRecord) records[gameMode] = gameScore;
  saveAll();
  const overlay = document.getElementById('gameOverlay');
  if (overlay) {
    overlay.style.display = 'flex';
    overlay.innerHTML = `<h3>Время вышло!</h3><p>Очки: ${gameScore}${isRecord ? ' 🏆 Новый рекорд!' : ''}</p><button class="game-start-btn" onclick="startGame()">Ещё раз</button>`;
  }
  if (gameScore >= 10) unlockAchievement('score_10');
  if (gameScore >= 25) unlockAchievement('score_25');
  if (gameScore >= 50) unlockAchievement('score_50');
  addJournal(`Реверс (${gameMode === 'boss' ? 'босс-раш' : 'обычный'}): ${gameScore} очков.`);
  showGameReport(gameScore, isRecord);
}
function showGameReport(score, isRecord) {
  const box = document.getElementById('gameReport');
  if (!box) return;
  const rank = score >= 50 ? 'АРХИВАРИУС' : score >= 25 ? 'ОПЕРАТИВНИК' : score >= 10 ? 'СВИДЕТЕЛЬ' : 'НОВИЧОК';
  box.innerHTML = `
    <div class="game-report-title">// ОТЧЁТ ЭПСИЛОНА</div>
    <div class="game-report-text">
      Аномалия нейтрализована. Ранг: <strong>${rank}</strong>. Очков: <strong>${score}</strong>.${isRecord ? ' Рекорд зафиксирован в архиве.' : ''}
    </div>
    <span class="game-report-rank">${isRecord ? '🏆 НОВЫЙ РЕКОРД' : 'ОПЕРАЦИЯ ЗАВЕРШЕНА'}</span>
  `;
  box.classList.add('show');
}

let duelDiff = 'easy', duelActive = false, duelP = 0, duelB = 0, duelTime = 10, duelInterval = null, duelBotTimer = null;
function selectDuelDifficulty(d) {
  duelDiff = d;
  document.querySelectorAll('.duel-diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
}
function duelClick() {
  if (!duelActive) { startDuel(); return; }
  duelP++;
  const ps = document.getElementById('duelPlayerScore'); if (ps) ps.textContent = duelP;
  const pb = document.getElementById('duelPlayerBar'); if (pb) pb.style.width = Math.min(100, duelP * 3) + '%';
}
function startDuel() {
  if (duelActive) return;
  duelActive = true; duelP = 0; duelB = 0; duelTime = 10;
  const result = document.getElementById('duelResult'); if (result) { result.textContent = ''; result.className = 'duel-result'; }
  const btn = document.getElementById('duelClickBtn'); if (btn) btn.textContent = 'ЖМИ!';
  const ps = document.getElementById('duelPlayerScore'); if (ps) ps.textContent = 0;
  const bs = document.getElementById('duelBotScore'); if (bs) bs.textContent = 0;
  const pb = document.getElementById('duelPlayerBar'); if (pb) pb.style.width = '0%';
  const bb = document.getElementById('duelBotBar'); if (bb) bb.style.width = '0%';
  const speed = duelDiff === 'easy' ? 700 : duelDiff === 'medium' ? 450 : 280;
  const chance = duelDiff === 'easy' ? 0.55 : duelDiff === 'medium' ? 0.7 : 0.85;
  duelBotTimer = setInterval(() => { if (Math.random() < chance) { duelB++; const bs = document.getElementById('duelBotScore'); if (bs) bs.textContent = duelB; const bb = document.getElementById('duelBotBar'); if (bb) bb.style.width = Math.min(100, duelB*3) + '%'; } }, speed);
  duelInterval = setInterval(() => {
    duelTime -= 0.1;
    const t = document.getElementById('duelTimer'); if (t) t.textContent = Math.max(0, duelTime).toFixed(1) + ' сек';
    if (duelTime <= 0) endDuel();
  }, 100);
}
function endDuel() {
  clearInterval(duelInterval); clearInterval(duelBotTimer); duelActive = false;
  const btn = document.getElementById('duelClickBtn'); if (btn) btn.textContent = 'Ещё раз';
  const result = document.getElementById('duelResult');
  if (result) {
    if (duelP > duelB) { result.textContent = `🏆 Победа! ${duelP} : ${duelB}`; result.className = 'duel-result win'; }
    else if (duelP < duelB) { result.textContent = `💀 Поражение. ${duelP} : ${duelB}`; result.className = 'duel-result lose'; }
    else { result.textContent = `🤝 Ничья. ${duelP} : ${duelB}`; result.className = 'duel-result draw'; }
  }
}

let audioCtx = null, radioNodes = [], radioPlaying = false;
function toggleRadio() {
  const box = document.getElementById('radioInner');
  const btn = document.getElementById('radioBtn');
  const status = document.getElementById('radioStatus');
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (radioPlaying) {
    radioNodes.forEach(n => { try { n.stop(); } catch(e){} });
    radioNodes = []; radioPlaying = false;
    if (box) box.classList.remove('playing');
    if (btn) btn.textContent = '▶';
    if (status) status.textContent = 'ЭФИР: ПАУЗА';
  } else {
    radioPlaying = true;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = 'sine'; osc1.frequency.value = 87.6;
    osc2.type = 'sine'; osc2.frequency.value = 174.2;
    gain.gain.value = 0.03;
    osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
    osc1.start(); osc2.start();
    radioNodes = [osc1, osc2];
    if (box) box.classList.add('playing');
    if (btn) btn.textContent = '⏸';
    if (status) status.textContent = 'ЭФИР: 87.6 FM · СИГНАЛ НЕСТАБИЛЕН';
  }
}

  'Аномалия рядом. Ты уже чувствуешь её дыхание.',
  'Сегодня тебе повезёт. Но не так, как ты думаешь.',
  'Кто-то наблюдает. Это не Эпсилон.',
  'Реверс не вечен. Береги силу.',
  'Ты найдёшь то, что искал. И потеряешь то, что берёг.',
  'Не доверяй тишине. Она громче крика.',
];
function getPrediction() {
  const el = document.getElementById('predictionText');
  if (!el) return;
  el.style.opacity = '0';
  setTimeout(() => {
    el.textContent = factionPrediction(PREDICTIONS);
    el.style.opacity = '1';
  }, 200);
}

/* ===================== УВЕДОМЛЕНИЯ ===================== */
function showNotification(text, type) {
  let n = document.getElementById('notificationBox');
  if (!n) {
    n = document.createElement('div');
    n.id = 'notificationBox';
    n.className = 'notification';
    document.body.appendChild(n);
  }
  n.textContent = text;
  n.className = 'notification' + (type ? ' ' + type : '');
  n.classList.add('show');
  clearTimeout(window._notifTimer);
  window._notifTimer = setTimeout(() => n.classList.remove('show'), 3000);
}

/* ===================== ПРОМОКОДЫ ===================== */
const PROMOS = {
  'AKI2026': 100, 'EPSILON': 250, 'REVERSE': 150, 'WITNESS': 200, 'OMEGA': 300,
};
function applyPromo() {
  const inp = document.getElementById('promoInput');
  if (!inp) return;
  const code = inp.value.trim().toUpperCase();
  if (!code) return;
  if (!currentUser) { showNotification('Сначала войдите в аккаунт!', 'error'); return; }
  if (PROMOS[code]) {
    coins += PROMOS[code]; saveAll();
    showNotification(`🎟 Промокод активирован! +${PROMOS[code]} 🪙`, 'success');
    updateCoinsUI();
    inp.value = '';
    addJournal(`Активирован промокод ${code}.`);
  } else {
    showNotification('❌ Неверный промокод', 'error');
  }
}
function updateCoinsUI() {
  const badge = document.getElementById('coinsBadge');
  const count = document.getElementById('coinsCount');
  if (count) count.textContent = coins;
  if (badge) badge.style.display = currentUser ? 'inline-flex' : 'none';
}

/* ===================== КОРЗИНА ===================== */
function updateCartCount() {
  const c = document.getElementById('cartCount');
  if (c) c.textContent = cart.length;
}
function openCart() {
  const modal = document.getElementById('cartModal');
  if (!modal) return;
  renderCart();
  modal.classList.add('active');
}
function closeCart() { document.getElementById('cartModal')?.classList.remove('active'); }
function renderCart() {
  const list = document.getElementById('cartList');
  if (!list) return;
  if (!cart.length) { list.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;font-style:italic;">Корзина пуста</div>'; return; }
  list.innerHTML = cart.map((item, i) => `
    <div class="cart-item">
      <div class="cart-item-emoji">${item.emoji || '📦'}</div>
      <div class="cart-item-info"><div class="cart-item-name">${item.name}</div><div class="cart-item-qty">${item.price} 🪙</div></div>
      <button class="cart-item-remove" onclick="removeFromCart(${i})">×</button>
    </div>
  `).join('');
}
function removeFromCart(i) { cart.splice(i,1); saveAll(); updateCartCount(); renderCart(); }

/* ===================== ТЕМА / ЯЗЫК ===================== */
function toggleTheme() {
  const isLight = document.body.classList.toggle('theme-light');
  localStorage.setItem(LS.theme, isLight ? 'light' : 'dark');
  const btn = document.getElementById('themeBtn'); if (btn) btn.textContent = isLight ? '☀️' : '🌙';
}
function toggleLang() {
  lang = lang === 'ru' ? 'en' : 'ru';
  localStorage.setItem(LS.lang, lang);
  const btn = document.getElementById('langBtn'); if (btn) btn.textContent = lang.toUpperCase() + ' ▾';
}

/* ===================== НАВИГАЦИЯ ===================== */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('page-' + id);
  if (page) page.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ===================== ЗАГРУЗКА ===================== */
function initLoading() {
  const screen = document.getElementById('loadingScreen');
  const fill = document.getElementById('loadingBarFill');
  const text = document.getElementById('loadingText');
  if (!screen || !fill || !text) return;
  const steps = ['Загрузка...', 'Проверка протоколов...', 'Синхронизация архива...', 'Готово.'];
  let p = 0, s = 0;
  const iv = setInterval(() => {
    p += Math.random() * 18 + 6;
    if (p > 100) p = 100;
    fill.style.width = p + '%';
    if (p > s * 25 && s < steps.length - 1) { s++; text.textContent = steps[s]; }
    if (p >= 100) {
      clearInterval(iv);
      setTimeout(() => { screen.classList.add('hidden'); initBg(); }, 400);
    }
  }, 220);
}
function initBg() {
  const bg = document.getElementById('animated-bg');
  if (!bg) return;
  for (let i = 0; i < 14; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'summer-leaf';
    leaf.textContent = ['🍃','🌿','🍂','🍁'][Math.floor(Math.random()*4)];
    leaf.style.left = Math.random()*100 + 'vw';
    leaf.style.fontSize = (12 + Math.random()*18) + 'px';
    leaf.style.animationDuration = (10 + Math.random()*14) + 's';
    leaf.style.animationDelay = (-Math.random()*20) + 's';
    leaf.style.setProperty('--drift', (Math.random()*200 - 100) + 'px');
    bg.appendChild(leaf);
  }
}

/* ===================== ИНИЦИАЛИЗАЦИЯ ===================== */
document.addEventListener('DOMContentLoaded', () => {
  initLoading();
  updateCoinsUI();
  updateCartCount();
  renderFriends();
  renderTimeline('all');
  applyFactionUI();
  renderJournal();
  const theme = localStorage.getItem(LS.theme);
  if (theme === 'light') { document.body.classList.add('theme-light'); const b = document.getElementById('themeBtn'); if (b) b.textContent = '☀️'; }
  const lb = document.getElementById('langBtn'); if (lb) lb.textContent = lang.toUpperCase() + ' ▾';
  applyCursor(profile.cursor || 'default');
  document.addEventListener('mousemove', (e) => {
    document.documentElement.style.setProperty('--mouse-x', e.clientX + 'px');
    document.documentElement.style.setProperty('--mouse-y', e.clientY + 'px');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.getElementById('profileModal')?.classList.contains('active')) closeProfile();
      if (document.getElementById('lightbox')?.classList.contains('active')) closeLightbox();
    }
  });
});
